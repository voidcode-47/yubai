name: build-and-publish

on:
  schedule:
    # 01:05 UTC = 北京时间 09:05。GitHub 的定时任务可能延迟数小时，
    # 所以再加两次兜底：11:05 和 21:05（北京时间）。当天已有缓存时
    # build-issue.php 会直接跳过，只重新导出，成本很低。
    - cron: '5 1 * * *'
    - cron: '5 3 * * *'
    - cron: '5 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MARGINALIA_STATIC: '1'
      MARGINALIA_SITE_URL: https://voidcode-47.github.io
      MARGINALIA_BASE_PATH: /yubai
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, xml, dom, openssl
          coverage: none

      - name: Build today's issue
        run: php bin/build-issue.php

      - name: Export static site
        run: php bin/export-static.php dist

      - name: Persist issue cache
        run: |
          set -uo pipefail
          git config user.name "yubai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/cache
          if git diff --cached --quiet; then
            echo "cache unchanged"
            exit 0
          fi
          git commit -m "content: $(date -u -d '+8 hours' +%F)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 15
          done
          # 缓存只是备用：推送失败不该连累这一期的页面，下一次运行会重新生成。
          echo "::warning::cache push failed after 3 attempts"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test the published site
        run: |
          set -euo pipefail
          base="https://voidcode-47.github.io/yubai"

          # 站点在北京时间 09:00 换期：零点到 09:00 之间，“今天”仍然是前一期的日期。
          # GitHub 的定时任务经常延迟，13:05 UTC 那次可能拖到次日凌晨才跑；若直接
          # 用 UTC+8 的日历日期，就会去检查一期还没发布的页面，每天误报 404。
          today=$(date -u -d '+8 hours' +%F)
          if [ "$(date -u -d '+8 hours' +%H)" -lt 9 ]; then
            today=$(date -u -d "$today -1 day" +%F)
          fi
          echo "expected issue date: $today"

          fetch() {
            url="$1"
            out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS --retry 2 --retry-delay 3 "$url" -o "$out"; then
                return 0
              fi
              echo "attempt $attempt: $url not ready, retrying"
              sleep 10
            done
            return 1
          }

          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$base/" -o /tmp/home.html && grep -q 'class="pick' /tmp/home.html; then
              break
            fi
            echo "home attempt $attempt: not ready, retrying"
            sleep 10
          done

          grep -q '余白' /tmp/home.html
          grep -q 'MARGINALIA' /tmp/home.html
          ! grep -q 'refresh.php' /tmp/home.html
          picks=$(grep -o 'class="pick' /tmp/home.html | wc -l)
          test "$picks" -ge 10

          fetch "$base/issue/${today}/" /tmp/issue.html
          grep -q 'class="pick' /tmp/issue.html

          fetch "$base/feed.xml" /tmp/feed.xml
          grep -q '<rss' /tmp/feed.xml

          fetch "$base/assets/style.css" /tmp/style.css
          grep -q -- '--ink' /tmp/style.css

          no_slash=$(curl -s -o /dev/null -w '%{http_code}' "$base/issue/${today}")
          test "$no_slash" = "200" || test "$no_slash" = "301"

          echo "published site OK: $base/ ($today)"

