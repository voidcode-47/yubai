name: build-and-publish

on:
  schedule:
    # 01:05 UTC = 北京时间 09:05，给抓取和部署留几分钟余量。
    - cron: '5 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MARGINALIA_STATIC: '1'
      MARGINALIA_SITE_URL: https://voidcode-47.github.io
      MARGINALIA_BASE_PATH: /yubai
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, xml, dom, openssl
          coverage: none

      - name: Build today's issue
        run: php bin/build-issue.php

      - name: Export static site
        run: php bin/export-static.php dist

      - name: Persist issue cache
        run: |
          git config user.name "yubai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/cache
          if git diff --cached --quiet; then
            echo "cache unchanged"
          else
            git commit -m "content: $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test the published site
        run: |
          set -euo pipefail
          base="https://voidcode-47.github.io/yubai"
          today=$(date -u -d '+8 hours' +%F)

          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/home.html -w '%{http_code}' "$base/")
            if [ "$code" = "200" ] && grep -q 'class="pick' /tmp/home.html; then
              break
            fi
            echo "attempt $attempt: HTTP $code, retrying"
            sleep 15
          done

          grep -q '余白' /tmp/home.html
          grep -q 'MARGINALIA' /tmp/home.html
          ! grep -q 'refresh.php' /tmp/home.html
          picks=$(grep -o 'class="pick' /tmp/home.html | wc -l)
          test "$picks" -ge 10

          curl -fsS "$base/issue/${today}/" | grep -q 'class="pick'
          curl -fsS "$base/feed.xml" | grep -q '<rss'
          curl -fsS "$base/assets/style.css" | grep -q '余白\|--ink'

          echo "published site OK: $base/ ($today)"

